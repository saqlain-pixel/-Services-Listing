<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Services - Professional Services</title>
    <style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',sans-serif;background:#fff;color:#000;line-height:1.6}header{background:#000;color:#fff;padding:60px 20px}header h1{font-size:3.5rem;margin-bottom:15px;font-weight:700;letter-spacing:-2px}header p{font-size:1.1em;opacity:.8;max-width:500px}.container{max-width:1400px;margin:0 auto;padding:0 20px}.filters{padding:40px 0;margin:40px 0;border-bottom:1px solid #e0e0e0}.filters h3{margin-bottom:20px;color:#000;font-size:.9rem;font-weight:700;text-transform:uppercase;letter-spacing:1px}.filter-group{display:flex;gap:30px;flex-wrap:wrap}.filter-group label{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:500;font-size:.95rem;transition:opacity .3s}.filter-group label:hover{opacity:.7}.filter-group input[type="radio"],.filter-group input[type="checkbox"]{cursor:pointer;width:18px;height:18px;accent-color:#000}.services-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:40px;margin:60px 0}.service-card{background:#fff;border-radius:0;overflow:hidden;border:1px solid #e0e0e0;transition:all .4s cubic-bezier(.25,.46,.45,.94);cursor:pointer;display:flex;flex-direction:column;position:relative}.service-card:hover{transform:translateY(-8px);box-shadow:0 20px 40px rgba(0,0,0,.1);border-color:#000}.service-card::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:rgba(0,0,0,.02);transition:left .4s cubic-bezier(.25,.46,.45,.94);pointer-events:none;z-index:1}.service-card:hover::before{left:100%}.service-image{width:100%;height:250px;background:#f5f5f5;display:flex;align-items:center;justify-content:center;font-size:3.5em;color:#000;overflow:hidden}.service-image img{width:100%;height:100%;object-fit:cover}.service-content{padding:30px;flex:1;display:flex;flex-direction:column;position:relative;z-index:2}.service-category{display:inline-block;background:#000;color:#fff;padding:6px 14px;border-radius:0;font-size:.75rem;font-weight:700;margin-bottom:15px;width:fit-content;text-transform:uppercase;letter-spacing:1px}.service-title{font-size:1.4em;font-weight:700;color:#000;margin-bottom:12px;line-height:1.2}.service-description{color:#666;font-size:.95em;margin-bottom:20px;flex:1;line-height:1.6}.service-footer{display:flex;justify-content:space-between;align-items:center;padding-top:20px;border-top:1px solid #e0e0e0}.service-rating{display:flex;align-items:center;gap:6px;color:#000;font-weight:600;font-size:.9em}.service-price{font-size:1.2em;font-weight:700;color:#000}.btn{display:inline-block;padding:14px 28px;border-radius:0;text-decoration:none;font-weight:600;transition:all .3s cubic-bezier(.25,.46,.45,.94);border:none;cursor:pointer;width:100%;text-align:center;margin-top:auto;font-size:.95em;text-transform:uppercase;letter-spacing:1px;background:#000;color:#fff}.btn:hover{background:#333;transform:scaleX(1.02)}.btn:active{transform:scaleX(.98)}.loading{text-align:center;padding:60px 20px;font-size:1rem;color:#000}.spinner{border:3px solid #e0e0e0;border-top:3px solid #000;border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:20px auto}@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}.loading-text{margin-top:15px;font-weight:500}.error{background:#fff;color:#000;padding:20px;border-radius:0;margin:20px 0;border:2px solid #000;border-left:5px solid #000}.error-title{font-weight:700;margin-bottom:8px;text-transform:uppercase;font-size:.9em}.empty-state{text-align:center;padding:80px 20px}.empty-state-icon{font-size:3em;margin-bottom:20px}.empty-state p{font-size:1.1em;color:#666;margin-bottom:30px}.search-bar{margin-bottom:30px;display:flex;gap:15px;align-items:center}.search-input{flex:1;max-width:400px;padding:12px 16px;border:2px solid #e0e0e0;border-radius:0;font-size:.95em;transition:border-color .3s;font-family:inherit}.search-input:focus{outline:0;border-color:#000}.search-reset{padding:12px 20px;background:#000;color:#fff;border:none;border-radius:0;cursor:pointer;font-weight:600;font-size:.9em;text-transform:uppercase;letter-spacing:.5px;transition:background .3s}.search-reset:hover{background:#333}.pagination{display:flex;justify-content:center;align-items:center;gap:10px;margin:60px 0;padding:30px 0;border-top:1px solid #e0e0e0}.pagination-info{font-size:.95em;color:#666;min-width:150px;text-align:center}.pagination button{padding:10px 20px;background:#000;color:#fff;border:none;border-radius:0;cursor:pointer;font-weight:600;font-size:.9em;text-transform:uppercase;letter-spacing:.5px;transition:all .3s}.pagination button:hover:not(:disabled){background:#333;transform:scale(1.05)}.pagination button:disabled{background:#ccc;cursor:not-allowed;opacity:.5}.page-numbers{display:flex;gap:5px}.page-btn{width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;background:#f5f5f5;color:#000;border:1px solid #e0e0e0;border-radius:0;cursor:pointer;font-weight:600;transition:all .3s}.page-btn:hover{background:#000;color:#fff}.page-btn.active{background:#000;color:#fff}.cache-indicator{font-size:.8em;color:#999;margin-top:10px;text-align:right}footer{background:#000;color:#fff;text-align:center;padding:40px 20px;margin-top:80px;font-size:.9em}@media(max-width:768px){header h1{font-size:2.2rem}header p{font-size:1rem}.services-grid{grid-template-columns:1fr;gap:30px;margin:40px 0}.filter-group{flex-direction:column;gap:15px}.filters{padding:30px 0}.container{padding:0 15px}.service-content{padding:20px}.service-title{font-size:1.2em}.service-image{height:200px;font-size:2.5em}.btn{padding:12px 20px}}@media(max-width:480px){header{padding:40px 15px}header h1{font-size:1.8rem;margin-bottom:10px}header p{font-size:.9rem}.service-card{border:none;box-shadow:0 4px 12px rgba(0,0,0,.08)}.filter-group{gap:12px}.filter-group label{font-size:.85rem}.service-content{padding:16px}.service-title{font-size:1.1em;margin-bottom:10px}.service-description{font-size:.9em;margin-bottom:15px}.service-footer{flex-direction:column;align-items:flex-start;gap:10px}.service-price{font-size:1.1em}.search-bar{flex-direction:column}.search-input{max-width:100%}.pagination{flex-wrap:wrap}.page-numbers{flex-wrap:wrap}}
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>Services</h1>
            <p>Discover our comprehensive range of professional solutions</p>
        </div>
    </header>

    <div class="container">
        <div class="filters">
            <h3>Filter by Category</h3>
            <div class="filter-group">
                <label><input type="radio" name="category" value="" checked>All Categories</label>
                <label><input type="radio" name="category" value="Web">Web Development</label>
                <label><input type="radio" name="category" value="Mobile">Mobile Apps</label>
                <label><input type="radio" name="category" value="AI">AI & Machine Learning</label>
                <label><input type="radio" name="category" value="Design">Design</label>
            </div>
        </div>

        <div class="search-bar">
            <input type="text" id="searchInput" class="search-input" placeholder="Search services...">
            <button class="search-reset" onclick="resetSearch()">Clear</button>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <div class="loading-text">Loading services...</div>
        </div>
        <div id="error" class="error" style="display:none">
            <div class="error-title">⚠ Error</div>
            <div class="error-message"></div>
        </div>
        <div id="servicesContainer" class="services-grid"></div>
        <div id="emptyState" class="empty-state" style="display:none">
            <div class="empty-state-icon">◯</div>
            <p>No services found.</p>
            <button class="btn" onclick="resetAllFilters()">Reset All Filters</button>
        </div>

        <div id="pagination" class="pagination" style="display:none">
            <button onclick="previousPage()" id="prevBtn">← Previous</button>
            <div class="pagination-info"><span id="pageInfo">Page 1 of 1</span></div>
            <div class="page-numbers" id="pageNumbers"></div>
            <button onclick="nextPage()" id="nextBtn">Next →</button>
        </div>
        <div class="cache-indicator" id="cacheIndicator"></div>
    </div>

    <footer><p>&copy; 2026 Professional Services. All rights reserved.</p></footer>

    <script>
const API_URL='http://localhost:5000/api/services',CACHE_EXPIRY=600000,ITEMS_PER_PAGE=6;let allServices=[],filteredServices=[],currentPage=1,searchQuery='',selectedCategory='';const DOM={loading:null,error:null,errorMsg:null,container:null,emptyState:null,pagination:null,pageInfo:null,pageNumbers:null,prevBtn:null,nextBtn:null,searchInput:null,cacheIndicator:null};function escapeHtml(e){const t={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};return e.replace(/[&<>"']/g,e=>t[e])}function initDOM(){DOM.loading=document.getElementById('loading'),DOM.error=document.getElementById('error'),DOM.errorMsg=document.querySelector('.error-message'),DOM.container=document.getElementById('servicesContainer'),DOM.emptyState=document.getElementById('emptyState'),DOM.pagination=document.getElementById('pagination'),DOM.pageInfo=document.getElementById('pageInfo'),DOM.pageNumbers=document.getElementById('pageNumbers'),DOM.prevBtn=document.getElementById('prevBtn'),DOM.nextBtn=document.getElementById('nextBtn'),DOM.searchInput=document.getElementById('searchInput'),DOM.cacheIndicator=document.getElementById('cacheIndicator')}class ServiceCache{static getCacheKey(e=''){return`services_cache_${e||'all'}`}static getCacheTimestampKey(e=''){return`services_cache_timestamp_${e||'all'}`}static isExpired(e=''){const t=localStorage.getItem(this.getCacheTimestampKey(e));return!t||Date.now()-parseInt(t)>CACHE_EXPIRY}static get(e=''){return this.isExpired(e)?(this.clear(e),null):(e=localStorage.getItem(this.getCacheKey(e)),e?JSON.parse(e):null)}static set(e,t=''){localStorage.setItem(this.getCacheKey(t),JSON.stringify(e)),localStorage.setItem(this.getCacheTimestampKey(t),Date.now().toString())}static clear(e=''){localStorage.removeItem(this.getCacheKey(e)),localStorage.removeItem(this.getCacheTimestampKey(e))}static clearAll(){Object.keys(localStorage).forEach(e=>{e.startsWith('services_cache_')&&localStorage.removeItem(e)})}}async function fetchServices(e=''){try{DOM.loading.style.display='block',DOM.error.style.display='none';let t=!1,s=ServiceCache.get(e);s?t=!0:((s=await(await fetch(e?`${API_URL}?category=${e}`:API_URL)).json()).success?s=s.data.services||s.data:((t={message:s.message||'Failed to fetch services'}),s=[]),ServiceCache.set(s,e)),allServices=s,currentPage=1,applyFilters(),showCacheIndicator(t),DOM.loading.style.display='none'}catch(e){console.error('Error:',e),DOM.loading.style.display='none',DOM.error.style.display='block',DOM.errorMsg.textContent=e.message||'Unable to load services.',DOM.container.innerHTML='',DOM.pagination.style.display='none'}}function applyFilters(){filteredServices=allServices.filter(e=>searchQuery===''||e.title.toLowerCase().includes(searchQuery.toLowerCase())||e.description.toLowerCase().includes(searchQuery.toLowerCase())),renderPaginatedServices(),updatePagination()}function renderPaginatedServices(){const e=(currentPage-1)*ITEMS_PER_PAGE;renderServices(filteredServices.slice(e,e+ITEMS_PER_PAGE))}function renderServices(e){if(0===e.length){DOM.emptyState.style.display='block',DOM.container.innerHTML='',DOM.pagination.style.display='none';return}DOM.emptyState.style.display='none',DOM.container.innerHTML=e.map(e=>`<div class="service-card" onclick="viewDetails('${escapeHtml(e.slug)}')"><div class="service-image">${e.image_url?`<img src="${escapeHtml(e.image_url)}" alt="${escapeHtml(e.title)}" loading="lazy">`:(escapeHtml(e.icon||'◆'))}</div><div class="service-content"><div class="service-category">${escapeHtml(e.category)}</div><h3 class="service-title">${escapeHtml(e.title)}</h3><p class="service-description">${escapeHtml(e.description)}</p><div class="service-footer"><div class="service-rating"><span class="stars">★</span>${e.rating||0} (${e.reviews||0})</div>${e.price?`<div class="service-price">$${e.price}</div>`:''}</div><button class="btn">View Details</button></div></div>`).join('')}function updatePagination(){const e=Math.ceil(filteredServices.length/ITEMS_PER_PAGE);DOM.pagination.style.display=e<=1?'none':'flex',DOM.pageInfo.textContent=`Page ${currentPage} of ${e}`,DOM.prevBtn.disabled=1===currentPage,DOM.nextBtn.disabled=currentPage===e;const t=DOM.pageNumbers;t.innerHTML='';let s=Math.max(1,currentPage-2),r=Math.min(e,s+4);r-s+1<5&&(s=Math.max(1,r-4));for(let e=s;e<=r;e++){const s=document.createElement('button');s.className=`page-btn ${e===currentPage?'active':''}`,s.textContent=e,s.onclick=()=>goToPage(e),t.appendChild(s)}}function previousPage(){currentPage>1&&(currentPage--,renderPaginatedServices(),updatePagination(),window.scrollTo({top:0,behavior:'smooth'}))}function nextPage(){currentPage<Math.ceil(filteredServices.length/ITEMS_PER_PAGE)&&(currentPage++,renderPaginatedServices(),updatePagination(),window.scrollTo({top:0,behavior:'smooth'}))}function goToPage(e){currentPage=e,renderPaginatedServices(),updatePagination(),window.scrollTo({top:0,behavior:'smooth'})}function viewDetails(e){window.location.href=`service-details.html?slug=${e}`}function resetSearch(){searchQuery='',DOM.searchInput.value='',currentPage=1,applyFilters()}function resetAllFilters(){searchQuery='',selectedCategory='',currentPage=1,DOM.searchInput.value='',document.querySelector('input[name="category"][value=""]').checked=!0,fetchServices()}function showCacheIndicator(e){DOM.cacheIndicator.textContent=e?'💾 Cached':'',e&&setTimeout(()=>{DOM.cacheIndicator.textContent=''},5e3)}document.addEventListener('DOMContentLoaded',()=>{initDOM(),DOM.searchInput.addEventListener('input',e=>{searchQuery=e.target.value.trim(),currentPage=1,applyFilters()}),document.querySelectorAll('input[name="category"]').forEach(e=>{e.addEventListener('change',e=>{selectedCategory=e.target.value,currentPage=1,fetchServices(selectedCategory)})}),fetchServices()});
    </script>
</body>
</html>
